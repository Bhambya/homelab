name: Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'hosts/**'
  workflow_dispatch:
    inputs:
      target_host:
        description: "Target host"
        required: true
        type: choice
        options:
          - vps
          - home-server-containers

jobs:
  deploy:
    name: Deploy Ansible Playbook
    runs-on: ubuntu-latest
    concurrency:
      group: host_management

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect modified folders
        if: github.event_name != 'workflow_dispatch'
        id: detect-changes
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow
          fi
          folders=$(git diff --name-only HEAD~1 HEAD | grep '^hosts/' | cut -d/ -f2 | sort | uniq | tr '\n' ' ' | xargs)
          echo "Modified folders: $folders"
          echo "folders=$folders" >> $GITHUB_OUTPUT

      - name: Install Ansible and dependencies
        run: |
          sudo apt-get install python3-pip
          pip install -r ./ansible/requirements.txt
          ansible-galaxy collection install -r ./ansible/requirements.yml
          ansible-galaxy role install -r ./ansible/requirements.yml

      - name: ⬇️ Check out secrets repository
        uses: actions/checkout@v7
        with:
          repository: Bhambya/homelab-secrets
          path: .secrets
          ssh-key: ${{ secrets.SECRETS_REPO_DEPLOY_KEY }}
          persist-credentials: false

      # Load the SSH private key into the ssh-agent
      - name: 🔑 Load SSH Key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          log-public-key: false
          ssh-private-key: ${{ secrets.ANSIBLE_SSH_KEY }}

      - name: Add the VPS host public keys to known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_HOST_SSH_PUBLIC_KEYS: ${{ secrets.VPS_HOST_SSH_PUBLIC_KEYS }}
        run: |
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo $VPS_HOST_SSH_PUBLIC_KEYS | sed "s/localhost/$VPS_HOST/g" >> ~/.ssh/known_hosts 

      - name: Disable strict host key checking for VPN hosts
        run: |
          cat << EOF >> ~/.ssh/config
          Host 10.13.*
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: 🅰 Deploy docker on hosts(s)
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          ANSIBLE_CONFIG: ansible/ansible.cfg
        shell: bash
        run: |
          IFS=' ' read -r -a folder_array <<< "${{ steps.detect-changes.outputs.folders || github.event.inputs.target_host }}"

          for folder in "${folder_array[@]}"; do
            ansible-playbook -i ansible/inventory.yml -i .secrets/inventory \
             -e "local_repo_path=$GITHUB_WORKSPACE" \
             ansible/playbooks/deploy-${folder}.yml
          done
