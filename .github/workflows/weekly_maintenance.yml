name: Weekly host maintenance

on:
  schedule:
    - cron: "0 22 * * 1" # At 03:30 IST, only on Tuesday
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of hosts to patch in parallel"
        required: true
        type: string
        default: '2'

jobs:
  deploy:
    name: Weekly host maintenance
    runs-on: ubuntu-latest
    concurrency:
      group: host_management

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Ansible
        run: |
          sudo apt-get install python3-pip
          pip install -r ./ansible/requirements.txt
          ansible-galaxy collection install -r ./ansible/requirements.yml
          ansible-galaxy role install -r ./ansible/requirements.yml

      - name: ⬇️ Check out secrets repository
        uses: actions/checkout@v7
        with:
          repository: Bhambya/homelab-secrets
          path: .secrets
          ssh-key: ${{ secrets.SECRETS_REPO_DEPLOY_KEY }}
          persist-credentials: false

      # Load the SSH private key into the ssh-agent
      - name: 🔑 Load SSH Key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          log-public-key: false
          ssh-private-key: ${{ secrets.ANSIBLE_SSH_KEY }}

      - name: Add the VPS host public keys to known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_HOST_SSH_PUBLIC_KEYS: ${{ secrets.VPS_HOST_SSH_PUBLIC_KEYS }}
        run: |
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' "$VPS_HOST_SSH_PUBLIC_KEYS" | sed "s/localhost/$VPS_HOST/g" >> ~/.ssh/known_hosts

      - name: Disable strict host key checking for VPN hosts
        run: |
          cat << EOF >> ~/.ssh/config
          Host 10.13.*
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: 🐳 Prune unused docker images
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          ansible-playbook -i ansible/inventory.yml -i .secrets/inventory \
           -e "batch_size=${{ github.event.inputs.batch_size || '2' }}" \
           ansible/playbooks/docker-prune.yml

      - name: 🔨 Patch all hosts
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          ansible-playbook -i ansible/inventory.yml -i .secrets/inventory \
           -l 'all:!home-server-wireguard-router-wg1' \
           -e "batch_size=${{ github.event.inputs.batch_size || '2' }}" \
           ansible/playbooks/patch.yml
