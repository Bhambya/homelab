env_files:
  - relative_path: docker/.env
    mode: "600"
    fixed:
      UID: '1001'
      GID: '1001'
      SMTP_PORT: '587'
      TIME_ZONE: 'Asia/Kolkata'
      WIREGUARD_PORT: '51820'
      FILEBROWSER_SRV_PATH: '/home/ubuntu/filebrowser_share'
    vars:
      VPS_HOST: ansible_ssh_host
    secrets:
      ALERTING_TELEGRAM_BOT_TOKEN: vault_alerting_telegram_bot_token
      ALERTING_TELEGRAM_CHAT_ID: vault_alerting_telegram_chat_id
      ALERTING_WHATSAPP_PHONE_NUMBER: vault_alerting_whatsapp_phone_number
      BASE_DOMAIN: vault_base_domain
      CF_API_EMAIL: vault_cf_api_email
      CF_DNS_API_TOKEN: vault_cf_dns_api_token
      CROWDSEC_FIREWALL_BOUNCER_API_KEY: vault_crowdsec_firewall_bouncer_api_key
      CROWDSEC_TRAEFIK_BOUNCER_API_KEY: vault_crowdsec_traefik_bouncer_api_key
      CUSTOM_AUTHELIA_OIDC_HMAC_SECRET: vault_custom_authelia_oidc_hmac_secret
      CUSTOM_AUTHELIA_JWT_SECRET: vault_custom_authelia_jwt_secret
      CUSTOM_AUTHELIA_LDAP_PASSWORD: vault_custom_authelia_ldap_password
      CUSTOM_AUTHELIA_SESSION_SECRET: vault_custom_authelia_session_secret
      CUSTOM_AUTHELIA_SMTP_PASSWORD: vault_custom_authelia_smtp_password
      CUSTOM_AUTHELIA_STORAGE_ENCRYPTION_KEY: vault_custom_authelia_storage_encryption_key
      CUSTOM_AUTHELIA_OIDC_GRAFANA_CLIENT_ID: vault_custom_authelia_oidc_grafana_client_id
      CUSTOM_AUTHELIA_OIDC_GRAFANA_CLIENT_SECRET_HASH: vault_custom_authelia_oidc_grafana_client_secret_hash
      CUSTOM_AUTHELIA_OIDC_IMMICH_CLIENT_ID: vault_custom_authelia_oidc_immich_client_id
      CUSTOM_AUTHELIA_OIDC_IMMICH_CLIENT_SECRET_HASH: vault_custom_authelia_oidc_immich_client_secret_hash
      CUSTOM_AUTHELIA_OIDC_JELLYFIN_CLIENT_ID: vault_custom_authelia_oidc_jellyfin_client_id
      CUSTOM_AUTHELIA_OIDC_JELLYFIN_CLIENT_SECRET_HASH: vault_custom_authelia_oidc_jellyfin_client_secret_hash
      CUSTOM_AUTHELIA_OIDC_NEXTCLOUD_CLIENT_ID: vault_custom_authelia_oidc_nextcloud_client_id
      CUSTOM_AUTHELIA_OIDC_NEXTCLOUD_CLIENT_SECRET_HASH: vault_custom_authelia_oidc_nextcloud_client_secret_hash
      CUSTOM_AUTHELIA_OIDC_OPKSSH_CLIENT_ID: vault_custom_authelia_oidc_opkssh_client_id
      CUSTOM_AUTHELIA_OIDC_OPKSSH_CLIENT_SECRET_HASH: vault_custom_authelia_oidc_opkssh_client_secret_hash
      CUSTOM_AUTHELIA_OIDC_PAPERLESS_CLIENT_ID: vault_custom_authelia_oidc_paperless_client_id
      CUSTOM_AUTHELIA_OIDC_PAPERLESS_CLIENT_SECRET_HASH: vault_custom_authelia_oidc_paperless_client_secret_hash
      CUSTOM_AUTHELIA_OIDC_PROXMOX_CLIENT_ID: vault_custom_authelia_oidc_proxmox_client_id
      CUSTOM_AUTHELIA_OIDC_PROXMOX_CLIENT_SECRET_HASH: vault_custom_authelia_oidc_proxmox_client_secret_hash
      DAWARICH_SECRET_KEY_BASE: vault_dawarich_secret_key_base
      DOCMOST_APP_SECRET: vault_docmost_app_secret
      FILEBROWSER_ADMIN_PASSWORD: vault_filebrowser_admin_password
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: vault_gf_auth_generic_oauth_client_id
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: vault_gf_auth_generic_oauth_client_secret
      GITHUB_RELEASE_MONITOR_AUTH_SECRET: vault_github_release_monitor_auth_secret
      IMMICH_API_KEY: vault_immich_api_key
      LINKWARDEN_OAUTH_CLIENT_ID: vault_linkwarden_oauth_client_id
      LINKWARDEN_OAUTH_DIGEST: vault_linkwarden_oauth_digest
      LINKWARDEN_OAUTH_SECRET: vault_linkwarden_oauth_secret
      LLDAP_JWT_SECRET: vault_lldap_jwt_secret
      LLDAP_KEY_SEED: vault_lldap_key_seed
      LLDAP_LDAP_BASE_DN: vault_lldap_ldap_base_dn
      LLDAP_LDAP_USER_PASS: vault_lldap_ldap_user_pass
      NEXTCLOUD_ADMIN_PASSWORD: vault_nextcloud_admin_password
      PAPERLESS_ENCRYPTED_FILE_PASSWORDS: vault_paperless_encrypted_file_passwords
      PAPERLESS_GMAIL_OAUTH_CLIENT_ID: vault_paperless_gmail_oauth_client_id
      PAPERLESS_GMAIL_OAUTH_CLIENT_SECRET: vault_paperless_gmail_oauth_client_secret
      PAPERLESS_OIDC_CLIENT_SECRET: vault_paperless_oidc_client_secret
      PAPERLESS_SECRET_KEY: vault_paperless_secret_key
      REDIS_PASSWORD: vault_redis_password
      SMTP_HOST: vault_smtp_host
      SMTP_PASSWORD: vault_smtp_password
      SMTP_SENDER: vault_smtp_sender
      SMTP_USERNAME: vault_smtp_username
      VW_ADMIN_TOKEN: vault_vw_admin_token

secret_files:
  - path: /var/lib/docker-data/authelia/secrets/oidc/jwks/public.pem
    secret: vault_authelia_oidc_jwks_public_pem
  - path: /var/lib/docker-data/authelia/secrets/oidc/jwks/private.pem
    secret: vault_authelia_oidc_jwks_private_pem
