# Mounted into the olivetin container at /config/config.yaml (see compose.yml). OliveTin
# is served at commands.<domain> through Traefik and Authelia (two-factor, admin group).
# Its only network is olivetin-traefik, shared with Traefik alone, and it reaches docker
# through the mounted socket.
listenAddressSingleHTTPFrontend: 0.0.0.0:1337

# Trust the user and groups Authelia's forward-auth sets (authResponseHeaders on the
# authelia middleware in compose.yml). Traefik overwrites these headers with Authelia's
# values, and only Traefik can reach OliveTin, so they cannot be forged.
authHttpHeaderUsername: Remote-User
authHttpHeaderUserGroup: Remote-Groups
authHttpHeaderUserGroupSep: ","

# Deny anything that arrives without a user, and only allow the LLDAP admin group
# (matching the Authelia rule), so OliveTin stays locked down even if that rule changes.
authRequireGuestsToLogin: true

defaultPolicy:
  showDiagnostics: false
  showLogList: false

accessControlLists:
  - name: admins
    matchUsergroups:
      - admin
    permissions:
      view: true
      exec: true
      logs: true
      kill: true
    policy:
      showDiagnostics: true
      showLogList: true
    addToEveryAction: true

  # execOnCron and execOnStartup run as the built-in users "cron" and "startup" (group
  # "system"), which authRequireGuestsToLogin otherwise blocks. Only attached to actions
  # that list it, and only lets them run.
  - name: scheduled
    matchUsernames:
      - cron
      - startup
    permissions:
      exec: true

actions:
  # OliveTin only accepts one of the listed choices, so nothing else reaches the shell
  - title: Recent CrowdSec decisions
    id: crowdsec_recent_decisions
    icon: <iconify-icon icon="selfhst:crowdsec"></iconify-icon>
    shell: docker exec crowdsec cscli decisions list --since {{ since }}
    onclick: execution-dialog
    timeout: 30
    arguments:
      - name: since
        title: Since
        description: Show IPs CrowdSec blocked within this time
        default: 15m
        choices:
          - title: Last 15 minutes
            value: 15m
          - title: Last hour
            value: 1h
          - title: Last 6 hours
            value: 6h
          - title: Last 12 hours
            value: 12h

  # Keeps the IP dropdown of "Delete CrowdSec decision" current. The ? in the jq filter
  # turns cscli's null (no decisions) into an empty list instead of an error, and
  # pipefail still fails the run if cscli itself fails.
  - title: Update CrowdSec decisions entity file
    icon: <iconify-icon icon="selfhst:crowdsec"></iconify-icon>
    shell: set -o pipefail; docker exec crowdsec cscli decisions list --since 12h --output json | jq '.[]?.decisions[]?' > /config/entities/crowdsec_decisions.json
    execOnStartup: true
    execOnCron: '*/30 * * * *'
    acls:
      - scheduled

  # Pick a recently blocked IP from the dropdown (the decision entity file, refreshed by
  # the hidden action below), or type one, which takes precedence. OliveTin can only fill
  # dropdown choices from an entity, not suggestions for a typed field, hence two fields.
  # exec (no shell) is required for regex arguments. The script is fixed: both values
  # reach it as positional arguments ($1, $2), never as part of the script text, and the
  # IP is passed to cscli as a single argument. The typed IP's regex accepts an IPv4 or
  # IPv6 address, or nothing.
  - title: Delete CrowdSec decision
    id: crowdsec_delete_decision
    icon: <iconify-icon icon="selfhst:crowdsec"></iconify-icon>
    exec:
      - sh
      - -c
      - |
        ip="${1:-$2}"
        if [ -z "$ip" ]; then
          echo "Pick a recently blocked IP or type one" >&2
          exit 1
        fi
        exec docker exec crowdsec cscli decisions delete --ip "$ip"
      - sh
      - "{{ typed_ip }}"
      - "{{ ip }}"
    onclick: execution-dialog
    timeout: 30
    triggers: ["Update CrowdSec decisions entity file"]
    arguments:
      - name: ip
        title: Recently blocked IP
        description: From CrowdSec decisions in the last 12 hours
        entity: decision
        choices:
          - value: '{{ decision.value }}'
            title: '{{ decision.value }} ({{ decision.scenario }})'
      - name: typed_ip
        title: Or type an IP
        description: Overrides the IP picked above; leave empty to use it
        type: 'regex:^(?:(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3}|[0-9a-fA-F]{0,4}(?::[0-9a-fA-F]{0,4}){2,7}))?$'
      - type: confirmation
        title: Unban this IP?

  # The dropdown is filled from the container entity file below. exec (no shell) passes
  # the chosen name to docker as a single argument. Restarting traefik or authelia drops
  # the connection to this page, so their output may not show.
  - title: Restart Docker container
    id: docker_restart_container
    icon: <iconify-icon icon="selfhst:docker"></iconify-icon>
    exec:
      - docker
      - restart
      - "{{ container }}"
    onclick: execution-dialog
    timeout: 120
    triggers: ["Update container entity file"]
    arguments:
      - name: container
        title: Container
        entity: container
        rejectNull: true
        choices:
          - value: '{{ container.Names }}'
            title: '{{ container.Names }}'

  # Keeps the container list for the dropdown above current
  - title: Update container entity file
    shell: docker ps -a --format json > /config/entities/containers.json
    hidden: true
    execOnStartup: true
    execOnCron: '*/10 * * * *'
    acls:
      - scheduled

  # The whatsapp container's API (port 5000) is not reachable from OliveTin's network, so
  # these call it from inside the container with its own python. Do not connect the two
  # containers' networks instead: anything that can reach OliveTin directly can forge the
  # Remote-User/Remote-Groups headers, skip Authelia, run actions as admin and reach the
  # docker socket (root on the VPS). whatsapp is a full Chromium browser running a third-
  # party web app with seccomp disabled, so a browser exploit there would become root on
  # the VPS. docker exec gives OliveTin nothing new (it already has the socket) and gives
  # whatsapp no new access. exec (no shell) passes the endpoint and the argument values
  # to the script as separate arguments, and json.dumps builds the body, so values cannot
  # inject shell or JSON. The API handles one request at a time, so a call can wait
  # behind Gatus' hourly dry run.
  - title: WhatsApp login
    id: whatsapp_login
    icon: <iconify-icon icon="selfhst:whatsapp"></iconify-icon>
    exec:
      - docker
      - exec
      - whatsapp
      - /server/.venv/bin/python3
      - -c
      # Shared with the send action. Arguments: endpoint, then JSON key/value pairs.
      # Must not contain double curly braces (OliveTin templating).
      - &whatsapp_api_call |
        import json, sys, urllib.error, urllib.request
        endpoint, *fields = sys.argv[1:]
        body = dict(zip(fields[::2], fields[1::2]))
        if endpoint == "message" and not body.get("message", "").strip():
            sys.exit("Enter a message, or check Dry run")
        request = urllib.request.Request(
            "http://localhost:5000/api/" + endpoint,
            data=json.dumps(body).encode(),
            headers={"Content-Type": "application/json"},
        )
        try:
            with urllib.request.urlopen(request, timeout=290) as response:
                print(response.read().decode())
        except urllib.error.HTTPError as error:
            print(error.code, error.read().decode())
            sys.exit(1)
      - login
    onclick: execution-dialog
    timeout: 300
    arguments:
      - type: confirmation
        title: Open whatsapp.<domain> first to scan the QR code, then start the login

  # A dry run checks that the chat opens and the message box is clickable, without
  # sending (the dry_run_message endpoint ignores the message). The checkbox picks the
  # endpoint: OliveTin maps the form's 1/0 to the matching choice value.
  - title: WhatsApp send message
    id: whatsapp_send_message
    icon: <iconify-icon icon="selfhst:whatsapp"></iconify-icon>
    exec:
      - docker
      - exec
      - whatsapp
      - /server/.venv/bin/python3
      - -c
      - *whatsapp_api_call
      - "{{ dry_run }}"
      - phone_number
      - "{{ phone_number }}"
      - message
      - "{{ message }}"
    onclick: execution-dialog
    timeout: 300
    arguments:
      - name: phone_number
        title: Phone number
        description: Country code and number, digits only (no spaces)
        type: 'regex:^\+?[0-9]{7,15}$'
        rejectNull: true
      - name: message
        title: Message
        description: Not needed for a dry run
        type: raw_string_multiline
      - name: dry_run
        title: Dry run?
        type: checkbox
        default: "0"
        choices:
          - title: "1"
            value: dry_run_message
          - title: "0"
            value: message

  # Authelia keeps its sessions (including remember-me ones) only in redis-authelia,
  # database 0, and that redis serves nothing else, so flushing it signs everyone out,
  # including you (the next page load asks you to log in again). It does not touch
  # TOTP/WebAuthn devices, and it does not end sessions that apps logged in through
  # Authelia OIDC (Paperless, Nextcloud, ...) hold themselves, or their OIDC tokens.
  # The password is read inside the container (REDISCLI_AUTH), so it is not in
  # OliveTin's logs or the process list.
  - title: Invalidate all Authelia sessions
    id: authelia_invalidate_sessions
    icon: <iconify-icon icon="selfhst:authelia"></iconify-icon>
    exec:
      - docker
      - exec
      - redis-authelia
      - sh
      - -c
      - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli -n 0 FLUSHDB
    onclick: execution-dialog
    timeout: 30
    arguments:
      - type: confirmation
        title: Sign out every Authelia session, including yours?

entities:
  - file: entities/containers.json
    name: container
  - file: entities/crowdsec_decisions.json
    name: decision
