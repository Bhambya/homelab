server:
  logging:
    - levels: "info|warning|error"
  sources:
    - path: "/srv"
      config:
        defaultPermissions:
          view: true
          modify: false
          create: false
          delete: false
          download: false
  database:
    path: "filebrowser.sqlite"
    migrateFrom: "database.db.old"
http:
  port: 80
  baseURL: "/"
userDefaults:
  listing:
    singleClick: false
  ui:
    darkMode: true
  account:
    disableSettings: false
    permissions:
      admin: false
      api: false
      share: false
