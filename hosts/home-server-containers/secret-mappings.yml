env_files:
  - relative_path: docker/.env
    mode: "600"
    fixed:
      USER: ubuntu
      TIME_ZONE: 'Asia/Kolkata'
      TZ: 'Asia/Kolkata'
      IMMICH_DB_PASSWORD: postgres
      IMMICH_DB_USERNAME: postgres
      IMMICH_DB_DATABASE_NAME: immich
      IMMICH_UPLOAD_PATH: /mnt/immich
      MEDIA_PATH: /mnt/media
      TORRENTS_PATH: /mnt/media/torrents
      AUDIOBOOKS_PATH: /mnt/media/Audiobooks
      EBOOKS_PATH: /mnt/media/EBooks
      MOVIES_PATH: /mnt/media/Movies
      TV_SHOWS_PATH: /mnt/media/TV
      VIDEOS_PATH: /mnt/Videos
      MUSIC_PATH: /mnt/media/Music
    secrets:
      VPS_IP: vault_vps_ip
      BASE_DOMAIN: vault_base_domain
      ALERTING_TELEGRAM_BOT_TOKEN: vault_alerting_telegram_bot_token
      ALERTING_TELEGRAM_CHAT_ID: vault_alerting_telegram_chat_id
      CF_API_EMAIL: vault_cf_api_email
      CF_DNS_API_TOKEN: vault_cf_dns_api_token
      FILEBROWSER_ADMIN_PASSWORD: vault_filebrowser_admin_password
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: vault_gf_auth_generic_oauth_client_secret
      PINCHFLAT_BASIC_AUTH_USERNAME: vault_pinchflat_basic_auth_username
      PINCHFLAT_BASIC_AUTH_PASSWORD: vault_pinchflat_basic_auth_password
      GF_SECURITY_ADMIN_PASSWORD: vault_gf_security_admin_password
      GLUETUN_OPENVPN_USER: vault_gluetun_openvpn_user
      GLUETUN_OPENVPN_PASSWORD: vault_gluetun_openvpn_password
      # Self-hosted GitHub runner container config
      GITHUB_RUNNER_REPO_URL: vault_github_runner_repo_url
      GITHUB_RUNNER_ACCESS_TOKEN: vault_github_runner_access_token

secret_files:
  - path: /var/lib/docker-data/backrest/restic-immich-backup-key.json
    secret: vault_backrest_restic_immich_backup_key
